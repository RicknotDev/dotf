name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
      - name: Vet
        run: go vet ./...

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Test
        # A throwaway HOME so no test can touch the runner's real dotfiles.
        run: |
          export HOME="$(mktemp -d)"
          export XDG_STATE_HOME="$HOME/.local/state"
          go test -race -coverprofile="$GITHUB_WORKSPACE/coverage.txt" -covermode=atomic ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: go build -ldflags="-X main.Version=$(git describe --tags --always --dirty)" -o dotf ./cmd/dotf
      - name: End-to-end (install, status, unapply, restore)
        run: ./scripts/e2e.sh ./dotf

  build:
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
            -o dotf-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/dotf
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dotf-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, unit-tests, integration-test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/dotf-linux-amd64 \
            artifacts/dotf-linux-arm64 \
            --title "DOTF ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
